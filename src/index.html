<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- ==========================================================================
        Informations générales de la page
    ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App | Gestionnaire de tâches</title>

    <!-- ==========================================================================
        Feuille de style principale
        Cette feuille importe toutes les autres feuilles CSS du projet.
    ========================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <!-- ==========================================================================
        Conteneur principal de l'application
        Toutes les parties de notre Todo App seront placées ici.
    ========================================================================== ====-->
    <div class="app">

        <!-- ===========================
             Barre latérale
             =========================== -->
        <aside class="sidebar">

            <div class="logo">
                <h1>Bangs.</h1>
            </div>

            <nav class="menu">

                <a href="#">🏠 Accueil</a>

                <a href="#">📅 Aujourd'hui</a>

                <a href="#">⭐ Important</a>

                <a href="#">✅ Terminées</a>

            </nav>

            <section class="projets">

                <h2>Mes projets</h2>

                <ul>

                    <li>Travail</li>

                    <li>Personnel</li>

                    <li>Shopping</li>

                </ul>

            </section>

        </aside>

        <!-- ===========================
             Contenu principal
             =========================== -->
        <main class="content">

            <header class="header">

                <div>

                    <h2>Mes tâches</h2>

                    <p>Organisez votre journée efficacement.</p>

                </div>

                <button id="add-task-button" type="button">

                    + Ajouter une tâche

                </button>

            </header>

            <!-- Les cartes des tâches seront générées dynamiquement en JavaScript -->

            <section class="task-list">
            </section>

        </main>

    </div>

    <!-- ==========================================================================
                        Modal : Ajouter une tâche
    ========================================================================== -->

        <div class="modal" id="task-modal">

            <div class="modal__content">

                <div class="modal__header">
                    <h2>Ajouter une tâche</h2>

                    <button type="button" id="close-modal-button" aria-label="Fermer">
                        ×
                    </button>
                </div>

                <form id="task-form">

                    <!-- Titre -->
                    <div class="form-group">
                        <label for="task-title">Titre</label>

                        <input
                            type="text"
                            id="task-title"
                            name="title"
                            placeholder="Ex : Apprendre JavaScript"
                            required
                        >
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="task-description">Description</label>

                        <textarea
                            id="task-description"
                            name="description"
                            placeholder="Décrivez votre tâche..."
                        ></textarea>
                    </div>

                    <!-- Priorité -->
                    <div class="form-group">
                        <label for="task-priority">Priorité</label>

                        <select id="task-priority" name="priority">
                            <option value="low">Basse</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Haute</option>
                        </select>
                    </div>

                    <!-- Date limite -->
                    <div class="form-group">
                        <label for="task-due-date">Date limite</label>

                        <input
                            type="date"
                            id="task-due-date"
                            name="dueDate"
                        >
                    </div>

                    <!-- Estimation -->
                    <div class="form-group">
                        <label for="task-estimated-time">Estimation du temps</label>

                        <input
                            type="text"
                            id="task-estimated-time"
                            name="estimatedTime"
                            placeholder="Ex : 2h"
                        >
                    </div>

                    <!-- Boutons -->
                    <div class="modal__actions">

                        <button
                            type="button"
                            id="cancel-modal-button"
                        >
                            Annuler
                        </button>

                        <button
                            type="submit"
                        >
                            Ajouter la tâche
                        </button>

                    </div>

                </form>

            </div>

        </div>

    <!-- ==========================================================================
        Fichier JavaScript principal
    =============================================================================-->
    <script type="module" src="./js/app.js"></script>

</body>

</html>
